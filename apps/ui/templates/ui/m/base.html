{% load access %}<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Site · Discern{% endblock %}</title>
<style>
:root{--paper:#F4F6FA;--card:#fff;--ink:#16142B;--grey:#605C78;--hair:#DCDEE8;--indigo:#2B2072;--cyan:#0E7FC4;
--ok:#16704F;--okbg:#E6F2EC;--no:#A81F1A;--nobg:#FAE9E7;--warn:#8A5A00;--warnbg:#FBF1DE;
--mono:ui-monospace,Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;
  -webkit-text-size-adjust:100%}
header{background:var(--indigo);color:#fff;padding:.9rem 1rem;display:flex;align-items:center;gap:.75rem;
  position:sticky;top:0;z-index:5}
header a{color:#fff;text-decoration:none;font-size:1.6rem;line-height:1;padding:.1rem .3rem}
header .t{font-weight:700;font-size:1.02rem;flex:1}
main{padding:1rem;padding-bottom:3rem;max-width:34rem;margin:0 auto}
h1{font-size:1.3rem;margin:0 0 .25rem}
.sub{color:var(--grey);font-size:.92rem;margin:0 0 1.1rem}
.card{background:var(--card);border:1px solid var(--hair);border-radius:8px;margin-bottom:.9rem;overflow:hidden}
.card h2{font-family:var(--mono);font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--grey);
  margin:0;padding:.7rem 1rem;border-bottom:1px solid var(--hair)}
.card .body{padding:1rem}
/* Tap targets sized for a gloved hand at a site gate, not a mouse. */
.row{display:flex;align-items:center;gap:.75rem;padding:1rem;border-bottom:1px solid var(--hair);
  text-decoration:none;color:var(--ink);min-height:64px}
.row:last-child{border-bottom:none}
.row:active{background:var(--paper)}
.row .main{flex:1;min-width:0}
.row .ttl{font-weight:600;font-size:1rem}
.row .meta{color:var(--grey);font-size:.85rem;margin-top:.1rem}
.row .go{color:var(--cyan);font-size:1.4rem}
.pill{display:inline-block;font-family:var(--mono);font-size:.68rem;padding:.16rem .45rem;border-radius:3px}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.no{background:var(--nobg);color:var(--no)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
label{display:block;font-size:.82rem;font-weight:600;color:var(--grey);margin:0 0 .3rem;text-transform:uppercase;
  letter-spacing:.05em;font-family:var(--mono)}
input,select,textarea{font:inherit;font-size:1.05rem;padding:.8rem;width:100%;border:1px solid var(--hair);
  border-radius:6px;background:var(--card);color:var(--ink);margin-bottom:1rem}
input:focus,select:focus,button:focus{outline:3px solid var(--cyan);outline-offset:1px}
button{font:inherit;font-size:1.05rem;font-weight:600;padding:1rem;width:100%;border-radius:6px;border:none;
  background:var(--indigo);color:#fff;cursor:pointer;min-height:56px}
button.sec{background:var(--card);color:var(--ink);border:1px solid var(--hair)}
.msg{padding:.8rem 1rem;border-radius:6px;border-left:4px solid;margin-bottom:1rem;font-size:.95rem}
.msg.success{background:var(--okbg);border-color:var(--ok)}
.msg.error{background:var(--nobg);border-color:var(--no)}
.msg.info{background:var(--card);border-color:var(--cyan)}
.empty{padding:1.75rem 1rem;text-align:center;color:var(--grey);font-size:.92rem}
.big{font-family:var(--mono);font-size:1.8rem;font-variant-numeric:tabular-nums}
.hint{color:var(--grey);font-size:.85rem;margin:.4rem 0 0}
</style></head><body>
<header>
  {% block back %}<a href="{% url 'm_home' %}" aria-label="Back">‹</a>{% endblock %}
  <span class="t">{% block heading %}Site{% endblock %}</span>
  <a href="/" style="font-size:.8rem;opacity:.8">Desktop</a>
</header>
<main>
  {% if messages %}{% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}{% endif %}
  {% block content %}{% endblock %}
</main></body></html>
