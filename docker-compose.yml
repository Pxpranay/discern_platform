services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: discern
      POSTGRES_USER: discern
      POSTGRES_PASSWORD: discern
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U discern"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  web:
    build: .
    # bootstrap migrates, seeds the roles and the demo login, and loads the
    # worked demo project — but only when the database has no project yet, so
    # a restart never overwrites data you have entered.
    command: sh -c "python manage.py bootstrap && python manage.py runserver 0.0.0.0:8000"
    volumes: [".:/app"]
    ports: ["8000:8000"]
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build: .
    command: celery -A config worker -l info
    volumes: [".:/app"]
    env_file: [.env]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

volumes:
  pgdata:
